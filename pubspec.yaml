name: tempopo
description: "Multi-step kitchen timers"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.4
  flutter_svg: ^2.1.0
  vibration: ">=2.0.0 <4.0.0"
  wakelock_plus: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: #F4EBD9"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/
    - assets/step_icons/
    - assets/patterns/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf